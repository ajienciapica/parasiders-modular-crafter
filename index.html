<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parasiders Auto Modular Crafter</title>
<style>
  body { font-family: Segoe UI, sans-serif; margin: 0; background: #111; color: #eee; display: flex; height: 100vh; }
  .side { width: 300px; padding: 12px; background: #1a1a1a; overflow-y: auto; }
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  select { width: 100%; margin: 4px 0 12px; padding: 8px; background: #222; color: white; border: 1px solid #444; }
  button { padding: 10px; margin: 4px 0; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
  button:hover { background: #0088ee; }
  canvas { border: 2px solid #444; background: #000; image-rendering: pixelated; }
  .nav { margin: 10px 0; }
  .status { position: fixed; bottom: 0; left: 0; right: 0; background: #000; padding: 6px; font-size: 12px; }
</style>
</head>
<body>
<div class="side">
  <h3>Cabeza</h3>
  <select id="headSel"></select>
  <h3>Torso</h3>
  <select id="torsoSel"></select>
  <h3>Piernas</h3>
  <select id="legsSel"></select>
  <button onclick="compose()">Componer 4 direcciones</button>
  <button onclick="exportSheet()">Exportar spritesheet RMXP</button>
  <p style="font-size:12px; color:#888;">Partes extraídas automáticamente de tus spritesheets de 32×48.</p>
</div>
<div class="main">
  <canvas id="preview" width="160" height="240"></canvas>
  <div class="nav">
    <button onclick="prev()" style="width:auto;">◀</button>
    <span id="info">Cargando partes...</span>
    <button onclick="next()" style="width:auto;">▶</button>
  </div>
</div>
<div class="status" id="status">Cargando biblioteca de partes...</div>

<script>
let library = { heads: [], torsos: [], legs: [] };
let images = {};
let frames = [];
let current = 0;
const fw = 32, fh = 48;
const dirs = ["Abajo", "Izquierda", "Derecha", "Arriba"];

async function loadLibrary() {
  const res = await fetch('parts/library.json');
  library = await res.json();
  const headSel = document.getElementById('headSel');
  const torsoSel = document.getElementById('torsoSel');
  const legsSel = document.getElementById('legsSel');
  library.heads.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.text = p.replace('_head.png','').replace('_Sprite','');
    headSel.appendChild(o);
  });
  library.torsos.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.text = p.replace('_torso.png','').replace('_Sprite','');
    torsoSel.appendChild(o);
  });
  library.legs.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.text = p.replace('_legs.png','').replace('_Sprite','');
    legsSel.appendChild(o);
  });
  document.getElementById('status').textContent = `Listo: ${library.heads.length} cabezas, ${library.torsos.length} torsos, ${library.legs.length} piernas`;
  await preload(library.heads[0]);
  await preload(library.torsos[0]);
  await preload(library.legs[0]);
  compose();
}

async function preload(name) {
  if (images[name]) return images[name];
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { images[name] = img; resolve(img); };
    img.src = 'parts/' + name;
  });
}

async function compose() {
  const headName = document.getElementById('headSel').value;
  const torsoName = document.getElementById('torsoSel').value;
  const legsName = document.getElementById('legsSel').value;
  const head = await preload(headName);
  const torso = await preload(torsoName);
  const legs = await preload(legsName);
  frames = [];
  for (let i = 0; i < 16; i++) {
    const c = document.createElement('canvas');
    c.width = fw; c.height = fh;
    const ctx = c.getContext('2d');
    if (legs) ctx.drawImage(legs, 0, 28);
    if (torso) ctx.drawImage(torso, 0, 14);
    if (head) ctx.drawImage(head, 0, 0);
    frames.push(c);
  }
  current = 0;
  redraw();
  document.getElementById('status').textContent = "Personaje compuesto. Navega las 4 direcciones.";
}

function redraw() {
  const canvas = document.getElementById('preview');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const scale = 5;
  canvas.width = fw * scale;
  canvas.height = fh * scale;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (frames[current]) ctx.drawImage(frames[current], 0, 0, canvas.width, canvas.height);
  const dir = Math.floor(current / 4);
  const fr = (current % 4) + 1;
  document.getElementById('info').textContent = `${dirs[dir]} · Frame ${fr}`;
}

function prev() { current = (current - 1 + 16) % 16; redraw(); }
function next() { current = (current + 1) % 16; redraw(); }

function exportSheet() {
  if (!frames.length) return;
  const sheet = document.createElement('canvas');
  sheet.width = fw * 4;
  sheet.height = fh * 4;
  const sctx = sheet.getContext('2d');
  for (let i = 0; i < 16; i++) {
    sctx.drawImage(frames[i], (i%4)*fw, Math.floor(i/4)*fh);
  }
  const a = document.createElement('a');
  a.href = sheet.toDataURL('image/png');
  a.download = 'parasiders_modular.png';
  a.click();
}

loadLibrary();
</script>
</body>
</html>
