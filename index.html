<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parasiders Character Generator</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#0d0d0d;color:#eee;height:100vh;display:flex;flex-direction:column}
  header{background:#161616;padding:10px 16px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:18px}
  .wrap{display:flex;flex:1;overflow:hidden}
  .col{width:280px;background:#141414;padding:12px;overflow-y:auto;border-right:1px solid #222}
  .col.right{border-right:none;border-left:1px solid #222}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111}
  .cat{margin-bottom:14px}
  .cat h3{margin:0 0 6px;font-size:12px;color:#888;text-transform:uppercase}
  select{width:100%;padding:7px;background:#222;color:#fff;border:1px solid #444;border-radius:4px}
  canvas{image-rendering:pixelated;border:2px solid #333;background:#000}
  button{padding:8px 14px;background:#0066cc;color:#fff;border:none;border-radius:5px;cursor:pointer;margin:4px}
  button:hover{background:#0088ee}
  button.sec{background:#333}
  .info{margin:8px 0;color:#aaa;font-size:14px}
  .status{background:#111;padding:6px 12px;font-size:12px;border-top:1px solid #222}
  .colors{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .sw{width:22px;height:22px;border-radius:3px;cursor:pointer;border:1px solid #555}
</style>
</head>
<body>
<header>
  <h1>Parasiders Character Generator</h1>
  <span>32×48 · 4 direcciones</span>
</header>
<div class="wrap">
  <div class="col">
    <div class="cat"><h3>Cabeza</h3><select id="head"></select></div>
    <div class="cat"><h3>Torso</h3><select id="torso"></select></div>
    <div class="cat"><h3>Piernas</h3><select id="legs"></select></div>
    <button onclick="build()" style="width:100%">Generar 4 direcciones</button>
  </div>
  <div class="center">
    <canvas id="cv" width="160" height="240"></canvas>
    <div>
      <button class="sec" onclick="nav(-1)">◀</button>
      <span class="info" id="lbl">Abajo · 1</span>
      <button class="sec" onclick="nav(1)">▶</button>
    </div>
    <button onclick="exportPNG()">Descargar spritesheet</button>
  </div>
  <div class="col right">
    <div class="cat">
      <h3>Variaciones de color</h3>
      <div class="colors" id="pal"></div>
      <button onclick="randomizeColors()" style="width:100%">Aleatorizar colores</button>
    </div>
    <p style="font-size:12px;color:#666">Partes reales de tus sprites en las 4 direcciones. Combina libremente.</p>
  </div>
</div>
<div class="status" id="st">Cargando...</div>

<script>
let lib = null, cache = {}, frames = [], cur = 0;
const FW=32, FH=48;
const DIRS=["down","left","right","up"];
const NAMES=["Abajo","Izquierda","Derecha","Arriba"];
const PALETTE=["#ffffff","#ff4444","#44ff44","#4444ff","#ffff44","#ff44ff","#44ffff","#ffaa00","#aa44ff","#88ff88","#ff8888","#8888ff"];

async function init(){
  const r = await fetch("parts/library.json");
  lib = await r.json();
  fill("head", lib.heads.down);
  fill("torso", lib.torsos.down);
  fill("legs", lib.legs.down);
  const pal = document.getElementById("pal");
  PALETTE.forEach(c=>{
    const d=document.createElement("div");
    d.className="sw"; d.style.background=c;
    d.onclick=()=>tint(c);
    pal.appendChild(d);
  });
  document.getElementById("st").textContent = `Partes: ${lib.heads.down.length} cabezas × 4 dir`;
  build();
}
function fill(id, arr){
  const s=document.getElementById(id);
  arr.forEach(p=>{
    const o=document.createElement("option");
    o.value=p;
    o.text=p.replace(/_down_h\.png| _down_t\.png|_down_l\.png|_Sprite.*|_down_.*/g,"").replace(/_/g," ");
    s.appendChild(o);
  });
}
async function img(name){
  if(cache[name]) return cache[name];
  return new Promise(res=>{
    const i=new Image();
    i.onload=()=>{cache[name]=i;res(i)};
    i.src="parts/"+name;
  });
}
async function build(){
  const h=document.getElementById("head").value;
  const t=document.getElementById("torso").value;
  const l=document.getElementById("legs").value;
  const baseH=h.replace("_down_h.png","");
  const baseT=t.replace("_down_t.png","");
  const baseL=l.replace("_down_l.png","");
  frames=[];
  for(let d=0;d<4;d++){
    const dn=DIRS[d];
    const hi=await img(baseH+"_"+dn+"_h.png").catch(()=>null);
    const ti=await img(baseT+"_"+dn+"_t.png").catch(()=>null);
    const li=await img(baseL+"_"+dn+"_l.png").catch(()=>null);
    for(let f=0;f<4;f++){
      const c=document.createElement("canvas");
      c.width=FW; c.height=FH;
      const ctx=c.getContext("2d");
      if(li) ctx.drawImage(li,0,28);
      if(ti) ctx.drawImage(ti,0,14);
      if(hi) ctx.drawImage(hi,0,0);
      frames.push(c);
    }
  }
  cur=0; draw();
  document.getElementById("st").textContent="Generado (4 direcciones)";
}
function draw(){
  const cv=document.getElementById("cv");
  const ctx=cv.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  const sc=5;
  cv.width=FW*sc; cv.height=FH*sc;
  ctx.clearRect(0,0,cv.width,cv.height);
  if(frames[cur]) ctx.drawImage(frames[cur],0,0,cv.width,cv.height);
  const dir=Math.floor(cur/4);
  document.getElementById("lbl").textContent=`${NAMES[dir]} · Frame ${(cur%4)+1}`;
}
function nav(d){cur=(cur+d+16)%16; draw();}
function tint(color){
  if(!frames.length) return;
  const c=frames[cur];
  const ctx=c.getContext("2d");
  const data=ctx.getImageData(0,0,FW,FH);
  const d=data.data;
  const r=parseInt(color.substr(1,2),16), g=parseInt(color.substr(3,2),16), b=parseInt(color.substr(5,2),16);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]>10 && d[i]>180 && d[i+1]>180 && d[i+2]>180){
      d[i]=r; d[i+1]=g; d[i+2]=b;
    }
  }
  ctx.putImageData(data,0,0);
  draw();
}
function randomizeColors(){
  const c=PALETTE[Math.floor(Math.random()*PALETTE.length)];
  tint(c);
}
function exportPNG(){
  if(!frames.length) return;
  const s=document.createElement("canvas");
  s.width=FW*4; s.height=FH*4;
  const ctx=s.getContext("2d");
  for(let i=0;i<16;i++) ctx.drawImage(frames[i],(i%4)*FW,Math.floor(i/4)*FH);
  const a=document.createElement("a");
  a.href=s.toDataURL("image/png");
  a.download="parasiders_char.png";
  a.click();
}
init();
</script>
</body>
</html>
