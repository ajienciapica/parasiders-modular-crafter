<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Parasiders Generator</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#0e0e0e;color:#eee;height:100vh;display:flex;flex-direction:column}
  header{background:#161616;padding:12px 20px;border-bottom:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:18px}
  .main{display:flex;flex:1;overflow:hidden}
  .side{width:280px;background:#121212;padding:16px;overflow-y:auto;border-right:1px solid #222}
  .preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a}
  label{display:block;font-size:12px;color:#888;margin:12px 0 4px;text-transform:uppercase}
  select,input[type=color]{width:100%;padding:8px;background:#1e1e1e;color:#fff;border:1px solid #333;border-radius:4px}
  button{width:100%;padding:10px;margin:6px 0;background:#0066cc;color:#fff;border:none;border-radius:6px;cursor:pointer}
  button:hover{background:#0088ff}
  button.sec{background:#2a2a2a}
  canvas{image-rendering:pixelated;border:2px solid #333;background:#000}
  .status{background:#111;padding:8px 16px;font-size:13px;border-top:1px solid #222}
</style>
</head>
<body>
<header>
  <h1>Parasiders Generator</h1>
  <span>32×48 · 4 dir · contornos negros</span>
</header>
<div class="main">
  <div class="side">
    <label>Cabeza</label>
    <select id="head">
      <option value="normal">Normal</option>
      <option value="hood">Capucha</option>
      <option value="helmet">Casco</option>
      <option value="hat">Sombrero</option>
      <option value="horns">Cuernos</option>
    </select>
    <label>Torso</label>
    <select id="torso">
      <option value="shirt">Camisa</option>
      <option value="armor">Armadura</option>
      <option value="robe">Túnica</option>
      <option value="jacket">Chaqueta</option>
    </select>
    <label>Piernas</label>
    <select id="legs">
      <option value="pants">Pantalón</option>
      <option value="armor">Armadura</option>
      <option value="boots">Botas</option>
    </select>
    <label>Color ropa</label>
    <input type="color" id="cloth" value="#374485">
    <label>Color secundario</label>
    <input type="color" id="sec" value="#642f2f">
    <button onclick="draw()">Generar</button>
    <button class="sec" onclick="random()">Aleatorio</button>
  </div>
  <div class="preview">
    <canvas id="sheet" width="384" height="576"></canvas>
    <button onclick="dl()" style="width:auto;margin-top:12px;padding:8px 24px">Descargar</button>
  </div>
</div>
<div class="status" id="st">Estilo plano + contorno negro + piel blanca</div>

<script>
const canvas = document.getElementById("sheet");
const ctx = canvas.getContext("2d");
const FW=32, FH=48;

function px(x,y,c){ ctx.fillStyle=c; ctx.fillRect(x,y,1,1); }

function outlineRect(x,y,w,h,fill,outline="#000000"){
  ctx.fillStyle = outline;
  ctx.fillRect(x-1,y-1,w+2,h+2);
  ctx.fillStyle = fill;
  ctx.fillRect(x,y,w,h);
}

function drawChar(ox, oy, dir, frame){
  const cloth = document.getElementById("cloth").value;
  const sec = document.getElementById("sec").value;
  const head = document.getElementById("head").value;
  const torso = document.getElementById("torso").value;
  const legs = document.getElementById("legs").value;
  const skin = "#ffffff";
  const bob = (frame % 2);

  // Legs
  const ly = oy + 30 + bob;
  if(legs === "pants"){
    outlineRect(ox+10, ly, 5, 14, sec);
    outlineRect(ox+17, ly, 5, 14, sec);
  } else if(legs === "armor"){
    outlineRect(ox+9, ly, 6, 15, cloth);
    outlineRect(ox+17, ly, 6, 15, cloth);
  } else {
    outlineRect(ox+10, ly, 5, 14, "#4a3a2a");
    outlineRect(ox+17, ly, 5, 14, "#4a3a2a");
  }

  // Torso
  const ty = oy + 16 + bob;
  if(torso === "armor"){
    outlineRect(ox+8, ty, 16, 16, cloth);
  } else if(torso === "robe"){
    outlineRect(ox+7, ty, 18, 18, cloth);
  } else {
    outlineRect(ox+9, ty, 14, 15, cloth);
  }

  // Head
  const hy = oy + 2 + bob;
  outlineRect(ox+10, hy, 12, 12, skin);

  // Extras
  if(head === "hood"){
    outlineRect(ox+8, hy-3, 16, 7, sec);
  } else if(head === "helmet"){
    outlineRect(ox+9, hy-2, 14, 6, cloth);
  } else if(head === "hat"){
    outlineRect(ox+7, hy-5, 18, 4, "#222");
  } else if(head === "horns"){
    outlineRect(ox+7, hy, 4, 5, "#333");
    outlineRect(ox+21, hy, 4, 5, "#333");
  }

  // Eyes
  if(dir < 3){
    px(ox+13, hy+5, "#000");
    px(ox+14, hy+5, "#000");
    px(ox+18, hy+5, "#000");
    px(ox+19, hy+5, "#000");
  }
}

function draw(){
  ctx.imageSmoothingEnabled = false;
  const sc = 3;
  canvas.width = FW*4*sc;
  canvas.height = FH*4*sc;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.scale(sc, sc);
  for(let d=0; d<4; d++){
    for(let f=0; f<4; f++){
      drawChar(f*FW, d*FH, d, f);
    }
  }
  ctx.restore();
  document.getElementById("st").textContent = "Generado";
}

function random(){
  const heads = ["normal","hood","helmet","hat","horns"];
  const torsos = ["shirt","armor","robe","jacket"];
  const legs = ["pants","armor","boots"];
  document.getElementById("head").value = heads[Math.floor(Math.random()*heads.length)];
  document.getElementById("torso").value = torsos[Math.floor(Math.random()*torsos.length)];
  document.getElementById("legs").value = legs[Math.floor(Math.random()*legs.length)];
  document.getElementById("cloth").value = "#" + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0");
  draw();
}

function dl(){
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "parasiders.png";
  a.click();
}

draw();
</script>
</body>
</html>
